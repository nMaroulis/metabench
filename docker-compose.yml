services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - DATABASE_URL=sqlite:///./storage/metabench.db
    volumes:
      - ./backend:/app   # make sure main.py is inside ./backend
      - backend-data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "5173"
    environment:
      - VITE_API_URL=http://backend:8080
    depends_on:
      - backend
  # Optional: PostgreSQL for production
  # postgres:
  #   image: postgres:16-alpine
  #   environment:
  #     POSTGRES_DB: metabench
  #     POSTGRES_USER: metabench
  #     POSTGRES_PASSWORD: metabench_secret
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  backend-data: # pgdata:
