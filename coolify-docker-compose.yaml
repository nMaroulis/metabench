services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      - DATABASE_URL=sqlite:///./storage/metabench.db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    environment:
      - VITE_API_URL=http://mcn1mz990od7yt3ocvsfdnth.83.212.96.37.sslip.io
    depends_on:
      - backend

