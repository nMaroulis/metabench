name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    
    - name: Run tests
      run: |
        pytest -v backend/tests/
    
# Coverage upload skipped for now as we're not using --cov
  
  lint:
    name: Lint with Ruff
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.13'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
    
    - name: Run Ruff
      run: |
        # Check for syntax errors
        ruff check .
        # Check for style issues
        ruff format --check .
        # Check for import sorting
        ruff check --select I .
        # Check for common issues
        ruff check --select F401,F403,F405,E402 .
        # Check for type issues
        ruff check --select UP .

  typecheck:
    name: Type Check (ty - non-blocking)
    runs-on: ubuntu-latest
    needs: lint

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run ty (non-blocking)
      continue-on-error: true
      run: |
        ty check .
